<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Conectando TikTok - Video Factory</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="legal">
    <p class="eyebrow">VIDEO FACTORY</p>
    <h1>Conectando TikTok…</h1>
    <p id="message">La autorización se está enviando de forma segura a la aplicación local.</p>
    <p><a id="manual" href="http://127.0.0.1:8765/tiktok/callback/">Continuar manualmente</a></p>
  </main>
  <script>
    (() => {
      const local = 'http://127.0.0.1:8765/tiktok/callback/' + window.location.search;
      document.getElementById('manual').href = local;
      window.location.replace(local);
    })();
  </script>
</body>
</html>
